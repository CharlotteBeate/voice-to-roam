name = "voice-to-roam"
compatibility_date = "2026-07-01"
pages_build_output_dir = "web"

# The passphrase vault: a salt, a hash of the auth value, and an AES-GCM
# ciphertext. Never the passphrase, never the Roam token in the clear.
#
# Free tier is 100k reads and 1k writes a day. Reads dominate here and writes
# happen only on a failed unlock or a credential change, so neither is near.
[[kv_namespaces]]
binding = "V2R"
id = "f10364fa492747c08b9d3de7fe3f18df"

# There is deliberately no mailer and no service binding any more. Sign-in is a
# passphrase you chose, verified against a hash, with the token decrypted in the
# browser — so nothing has to send email, and no allowlist has to be maintained.
